<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Stock - نظام إدارة المخزن</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #4F46E5; --primary-hover: #4338CA; --success: #10B981; --danger: #EF4444; --bg-color: #F3F4F6; --card-bg: #FFFFFF; --text-main: #1F2937; --text-muted: #6B7280; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; box-sizing: border-box; }
        .navbar { background-color: var(--card-bg); padding: 15px 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--primary); }
        .nav-actions { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { font-family: 'Cairo', sans-serif; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { filter: brightness(0.9); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { filter: brightness(0.9); }
        .btn-excel { background: #1D6F42; color: white; }
        .btn-excel:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px; transition: background 0.2s; }
        .btn-icon:hover { background: #E5E7EB; }
        .btn-icon.delete:hover { background: #FEE2E2; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); position: relative; border: 1px solid #E5E7EB; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .card-title { font-size: 20px; font-weight: 700; margin: 0; flex: 1; }
        .card-controls { display: flex; gap: 5px; }
        .stock-value { font-size: 48px; font-weight: 800; color: var(--primary); text-align: center; margin: 10px 0; line-height: 1; }
        .min-limit-badge { background: #F3F4F6; color: var(--text-muted); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-align: center; display: inline-block; margin: 0 auto 20px auto; width: fit-content; }
        .alert-pulse { position: absolute; top: -10px; right: -10px; background: var(--danger); color: white; font-size: 12px; padding: 4px 10px; border-radius: 20px; animation: pulse 1.5s infinite; display: none; z-index: 10; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .low-stock .stock-value { color: var(--danger); }
        .low-stock .alert-pulse { display: block; }
        .low-stock { border-color: var(--danger); }
        .card-actions { display: flex; gap: 10px; }
        .card-actions .btn { flex: 1; justify-content: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); transform: scale(0.9); transition: transform 0.3s; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { margin-bottom: 20px; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; box-sizing: border-box; outline: none; }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .logs-section { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; }
        .log-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #E5E7EB; min-width: 600px; }
        .log-row:last-child { border-bottom: none; }
        .log-badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; }
        .badge-in { background: #D1FAE5; color: #065F46; }
        .badge-out { background: #FEE2E2; color: #991B1B; }
        .log-controls { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <datalist id="reasons-list">
        <option value="تدريب">
        <option value="مباراة">
        <option value="توريد جديد">
        <option value="تالف">
    </datalist>

    <div class="navbar">
        <h1>Team Stock</h1>
        <div class="nav-actions">
            <button class="btn btn-primary" onclick="window.openAddItem()">➕ إضافة صنف</button>
            <button class="btn btn-excel" onclick="window.exportToExcel()">📊 تصدير إكسل</button>
            <button class="btn btn-danger" onclick="window.clearAllData()">🗑️ حذف الكل</button>
        </div>
    </div>

    <div class="container">
        <div class="cards-grid" id="cardsContainer">
            <p style="text-align:center; color:#6B7280; font-size: 18px;">جاري تحميل البيانات من السحابة...</p>
        </div>
        <div class="logs-section">
            <h2 style="margin-top:0;">سجل الحركات الأخير</h2>
            <div id="logsContainer"></div>
        </div>
    </div>

    <!-- نوافذ إضافة الأصناف والحركات -->
    <div class="modal-overlay" id="add-item-modal">
        <div class="modal-content">
            <div class="modal-header" id="item-modal-title">إضافة صنف جديد</div>
            <input type="hidden" id="edit-item-id">
            <div class="form-group">
                <label>اسم الصنف</label>
                <input type="text" id="new-item-name" class="form-control">
            </div>
            <div class="form-group">
                <label>الحد الأدنى للتنبيه</label>
                <input type="number" id="new-item-limit" class="form-control" min="1">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" style="flex:1" onclick="window.saveItem()">حفظ الصنف</button>
                <button class="btn" style="background:#E5E7EB; color:#374151; flex:1" onclick="window.closeModal('add-item-modal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="transaction-modal">
        <div class="modal-content">
            <div class="modal-header" id="trans-title">تسجيل حركة</div>
            <input type="hidden" id="trans-id">
            <input type="hidden" id="trans-item-id">
            
            <div class="form-group">
                <label>نوع الحركة</label>
                <select id="trans-type" class="form-control">
                    <option value="IN">وارد (+)</option>
                    <option value="OUT">منصرف (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>التاريخ</label>
                <input type="date" id="trans-date" class="form-control">
            </div>
            <div class="form-group">
                <label>الكمية</label>
                <input type="number" id="trans-qty" class="form-control" min="1">
            </div>
            <div class="form-group">
                <label>السبب</label>
                <input list="reasons-list" id="trans-reason" class="form-control">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" style="flex:1" onclick="window.submitTransaction()">تأكيد</button>
                <button class="btn" style="background:#E5E7EB; color:#374151; flex:1" onclick="window.closeModal('transaction-modal')">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- أكواد Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, increment, query, orderBy, limit, getDocs } 
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        // بيانات مشروعك (Team Stock)
        const firebaseConfig = {
            apiKey: "AIzaSyD07-P4UF3bJegBSfwKtfzRzoxxHCD9PzE",
            authDomain: "team-stock-fd727.firebaseapp.com",
            projectId: "team-stock-fd727",
            storageBucket: "team-stock-fd727.firebasestorage.app",
            messagingSenderId: "1061998834280",
            appId: "1:1061998834280:web:0d4dd55254bcc1559a81dd",
            measurementId: "G-KWTW48KT3E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let inventory = [];
        let logs = [];

        window.getTodayDate = () => new Date().toISOString().split('T')[0];

        // الاستماع للأصناف
        onSnapshot(collection(db, "items"), (snapshot) => {
            inventory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderCards();
        });

        // الاستماع للسجل
        const logsQuery = query(collection(db, "logs"), orderBy("timestamp", "desc"), limit(50));
        onSnapshot(logsQuery, (snapshot) => {
            logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderLogs();
        });

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; 
            if(inventory.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#6B7280; font-size: 18px;">لا توجد أصناف حالياً. قم بإضافة صنف جديد للبدء.</p>';
                return;
            }
            inventory.forEach(item => {
                const isLow = item.stock <= item.minLimit;
                const card = document.createElement('div');
                card.className = `card ${isLow ? 'low-stock' : ''}`;
                card.innerHTML = `
                    <div class="alert-pulse">اطلب الآن</div>
                    <div class="card-header">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-controls">
                            <button class="btn-icon" title="تعديل الصنف" onclick="window.openEditItem('${item.id}')">✏️</button>
                            <button class="btn-icon delete" title="حذف الصنف" onclick="window.deleteItem('${item.id}')">🗑️</button>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <div class="stock-value">${item.stock}</div>
                        <div class="min-limit-badge">الحد الأدنى: ${item.minLimit}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-success" onclick="window.openTransactionModal('${item.id}', 'IN')">📥 وارد</button>
                        <button class="btn btn-danger" onclick="window.openTransactionModal('${item.id}', 'OUT')">📤 منصرف</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            container.innerHTML = '';
            if(logs.length === 0) {
                container.innerHTML = '<p style="color:#6B7280;">لا توجد حركات مسجلة.</p>';
                return;
            }
            logs.forEach(log => {
                const item = inventory.find(i => i.id === log.itemId);
                const itemName = item ? item.name : 'صنف محذوف';
                const isOpIn = log.type === 'IN';
                const logRow = document.createElement('div');
                logRow.className = 'log-row';
                logRow.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px; width:40%;">
                        <span class="log-badge ${isOpIn ? 'badge-in' : 'badge-out'}">
                            ${isOpIn ? 'وارد' : 'منصرف'} (${log.qty})
                        </span>
                        <strong>${itemName}</strong>
                    </div>
                    <div style="width:25%; color:var(--text-muted);">${log.reason}</div>
                    <div style="width:20%; text-align:left; color:var(--text-muted); font-size:13px;">${log.dateVal}</div>
                    <div class="log-controls">
                        <button class="btn-icon" title="تعديل الحركة" onclick="window.openEditLog('${log.id}')">✏️</button>
                        <button class="btn-icon delete" title="حذف الحركة" onclick="window.deleteLog('${log.id}')">🗑️</button>
                    </div>
                `;
                container.appendChild(logRow);
            });
        }

        window.openModal = id => document.getElementById(id).classList.add('active');
        window.closeModal = id => { 
            document.getElementById(id).classList.remove('active'); 
            document.querySelectorAll('.form-control').forEach(el => el.value = '');
        };

        window.openAddItem = () => {
            document.getElementById('item-modal-title').textContent = 'إضافة صنف جديد';
            document.getElementById('edit-item-id').value = '';
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-limit').value = '20';
            window.openModal('add-item-modal');
        };

        window.openEditItem = (itemId) => {
            const item = inventory.find(i => i.id === itemId);
            if(!item) return;
            document.getElementById('item-modal-title').textContent = 'تعديل بيانات الصنف';
            document.getElementById('edit-item-id').value = item.id;
            document.getElementById('new-item-name').value = item.name;
            document.getElementById('new-item-limit').value = item.minLimit;
            window.openModal('add-item-modal');
        };

        window.saveItem = async () => {
            const editId = document.getElementById('edit-item-id').value;
            const name = document.getElementById('new-item-name').value.trim();
            const minLimit = parseInt(document.getElementById('new-item-limit').value);

            if(!name) return alert('يرجى إدخال اسم الصنف');
            if(isNaN(minLimit) || minLimit < 0) return alert('الحد الأدنى غير صحيح');

            try {
                if(editId) {
                    await updateDoc(doc(db, "items", editId), { name, minLimit });
                } else {
                    await addDoc(collection(db, "items"), { name, stock: 0, minLimit });
                }
                window.closeModal('add-item-modal');
            } catch(e) { alert("حدث خطأ في الاتصال بقاعدة البيانات"); console.error(e); }
        };

        window.deleteItem = async (itemId) => {
            if(confirm('هل أنت متأكد من حذف هذا الصنف؟ (لن يتم حذف حركاته من السجل)')) {
                await deleteDoc(doc(db, "items", itemId));
            }
        };

        window.openTransactionModal = (itemId, type) => {
            const item = inventory.find(i => i.id === itemId);
            if(!item) return;
            document.getElementById('trans-id').value = ''; 
            document.getElementById('trans-item-id').value = itemId;
            document.getElementById('trans-type').value = type;
            document.getElementById('trans-type').disabled = true; 
            document.getElementById('trans-date').value = window.getTodayDate();
            document.getElementById('trans-qty').value = '1';
            document.getElementById('trans-reason').value = type === 'IN' ? 'توريد جديد' : '';
            document.getElementById('trans-title').textContent = `حركة جديدة: ${item.name}`;
            window.openModal('transaction-modal');
        };

        window.openEditLog = (logId) => {
            const log = logs.find(l => l.id === logId);
            if(!log) return;
            const item = inventory.find(i => i.id === log.itemId);
            document.getElementById('trans-title').textContent = `تعديل حركة: ${item ? item.name : 'صنف محذوف'}`;
            document.getElementById('trans-id').value = log.id;
            document.getElementById('trans-item-id').value = log.itemId;
            document.getElementById('trans-type').value = log.type;
            document.getElementById('trans-type').disabled = false; 
            document.getElementById('trans-date').value = log.dateVal;
            document.getElementById('trans-qty').value = log.qty;
            document.getElementById('trans-reason').value = log.reason;
            window.openModal('transaction-modal');
        };

        window.submitTransaction = async () => {
            const transId = document.getElementById('trans-id').value; 
            const itemId = document.getElementById('trans-item-id').value;
            const type = document.getElementById('trans-type').value;
            const dateVal = document.getElementById('trans-date').value;
            const qty = parseInt(document.getElementById('trans-qty').value);
            const reason = document.getElementById('trans-reason').value.trim() || 'بدون سبب';

            if(isNaN(qty) || qty <= 0) return alert('يرجى إدخال كمية صحيحة');

            try {
                if (transId) {
                    const oldLog = logs.find(l => l.id === transId);
                    let revertQty = oldLog.type === 'IN' ? -oldLog.qty : oldLog.qty;
                    await updateDoc(doc(db, "items", oldLog.itemId), { stock: increment(revertQty) });
                    await updateDoc(doc(db, "logs", transId), { type, dateVal, qty, reason });
                    let applyQty = type === 'IN' ? qty : -qty;
                    await updateDoc(doc(db, "items", itemId), { stock: increment(applyQty) });
                } else {
                    let applyQty = type === 'IN' ? qty : -qty;
                    await updateDoc(doc(db, "items", itemId), { stock: increment(applyQty) });
                    await addDoc(collection(db, "logs"), { itemId, type, dateVal, qty, reason, timestamp: Date.now() });
                }
                window.closeModal('transaction-modal');
            } catch(e) { alert("حدث خطأ أثناء حفظ الحركة"); console.error(e); }
        };

        window.deleteLog = async (logId) => {
            if(confirm('هل أنت متأكد من حذف هذه الحركة؟ سيتم استرجاع/خصم الكمية من الرصيد.')) {
                try {
                    const log = logs.find(l => l.id === logId);
                    let revertQty = log.type === 'IN' ? -log.qty : log.qty;
                    await updateDoc(doc(db, "items", log.itemId), { stock: increment(revertQty) });
                    await deleteDoc(doc(db, "logs", logId));
                } catch(e) { alert("خطأ في الحذف"); console.error(e); }
            }
        };

        window.clearAllData = async () => {
            if(confirm('⚠️ تحذير نهائي: هل أنت متأكد من حذف جميع الأصناف وحركات السجل نهائياً؟\nسيتم تصفير المخزن بالكامل ولن يمكنك استرجاع البيانات!')) {
                try {
                    const itemsSnapshot = await getDocs(collection(db, "items"));
                    itemsSnapshot.forEach((document) => { deleteDoc(doc(db, "items", document.id)); });
                    const logsSnapshot = await getDocs(collection(db, "logs"));
                    logsSnapshot.forEach((document) => { deleteDoc(doc(db, "logs", document.id)); });
                    alert('تم مسح المخزن بالكامل بنجاح!');
                } catch (error) { alert('حدث خطأ أثناء مسح البيانات.'); }
            }
        };

        window.exportToExcel = () => {
            if(logs.length === 0) return alert('لا توجد بيانات لتصديرها!');
            const excelData = logs.map(log => {
                const item = inventory.find(i => i.id === log.itemId);
                return {
                    "التاريخ": log.dateVal,
                    "اسم الصنف": item ? item.name : 'صنف محذوف',
                    "نوع الحركة": log.type === 'IN' ? 'وارد' : 'منصرف',
                    "الكمية": log.qty,
                    "السبب": log.reason
                };
            });
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "سجل المخزن");
            XLSX.writeFile(workbook, `تقرير_المخزن_${window.getTodayDate()}.xlsx`);
        };
    </script>
</body>
</html>
